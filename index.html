<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A One Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A One Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;
 padding-top:env(safe-area-inset-top)}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 color:#fff;font:16px system-ui,sans-serif;gap:14px;z-index:0}
#ld img{width:120px;border-radius:26px}
#fb{display:none;position:fixed;bottom:16px;left:0;right:0;text-align:center;z-index:2}
#fb a{color:#fff;background:#2b5cff;padding:10px 18px;border-radius:10px;text-decoration:none;font:15px system-ui}
</style>
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><div>A One Studio</div></div>
<iframe id="app" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="fb"><a id="fa" href="#">فتح البرنامج مباشرة</a></div>
<script>
var URL_APP="https://script.google.com/macros/s/AKfycbx-VeSRhrb5IyqDdZeylq8FxWcbnk1MRoJnkr2pKeZdq22ZQZ2KJWDMNcGba9uuV2mj/exec";
document.getElementById('app').src=URL_APP;
document.getElementById('fa').href=URL_APP;
setTimeout(function(){document.getElementById('fb').style.display='block'},12000);
</script>
</body>
</html>
